[build]
builder = "NIXPACKS"

[deploy]
startCommand = "cd apps/web && node server.js"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "web"
[services.builder]
builder = "NIXPACKS"
[services.deploy]
startCommand = "cd apps/web && pnpm build && pnpm start"
