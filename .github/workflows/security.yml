name: Security Audit
on:
  schedule:
    - cron: '0 0 * * 1'
  push:
    branches: [main]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm audit --audit-level=highci: add weekly security audit workflow
